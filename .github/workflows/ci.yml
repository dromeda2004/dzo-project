# epic1.task5 — the pre-merge gate from AGENTS_DZO.md §3: every push and PR runs
# `make check` against a real Postgres, plus secret scanning (§11 Level 1).
# Merge blocking itself is enforced by branch protection on master, which
# requires both jobs below to pass — see docs/EPIC1_TRACKER.md (epic1.task5).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: dzo
          POSTGRES_PASSWORD: dzo
          POSTGRES_DB: dzo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dzo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://dzo:dzo@localhost:5432/dzo
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://dzo:dzo@localhost:5432/dzo
      APP_ENV: ci
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv==0.11.12

      # --locked installs exactly what uv.lock pins, and fails if uv.lock is out
      # of date with pyproject.toml (run `uv lock` and commit the result).
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Tests run against the migrated schema, so this also catches a broken migration.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: make check
        run: uv run make check

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan full history, not just the tip commit

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose
